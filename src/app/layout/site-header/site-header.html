<header class="navbar">
  <nav class="container navbar__inner" aria-label="Principal">
    <a class="brand" routerLink="/" aria-label="Ir para o início">
      <span class="brand__mark" aria-hidden="true">VG</span>
      <span class="brand__name">{{ siteName }}</span>
    </a>

    <ul class="nav-links">
      <li>
        <a
          class="nav-link"
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          ariaCurrentWhenActive="page"
          aria-label="Início"
        >
          <i class="bi bi-house" aria-hidden="true"></i> <span class="nav-link__label">Início</span>
        </a>
      </li>
      <li>
        <a
          class="nav-link"
          routerLink="/categorias"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          aria-label="Categorias"
        >
          <i class="bi bi-folder2" aria-hidden="true"></i>
          <span class="nav-link__label">Categorias</span>
        </a>
      </li>
      <li>
        <a
          class="nav-link"
          routerLink="/tags"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          aria-label="Tags"
        >
          <i class="bi bi-tags" aria-hidden="true"></i> <span class="nav-link__label">Tags</span>
        </a>
      </li>
      @for (page of pages(); track page.id) {
        <li>
          <a
            class="nav-link"
            [routerLink]="['/', page.slug]"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            [attr.aria-label]="page.title"
          >
            <i class="bi bi-{{ page.icon }}" aria-hidden="true"></i>
            <span class="nav-link__label">{{ page.title }}</span>
          </a>
        </li>
      }
      <li>
        <a
          class="nav-link"
          routerLink="/busca"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          aria-label="Buscar posts"
        >
          <i class="bi bi-search" aria-hidden="true"></i> <span class="nav-link__label">Busca</span>
        </a>
      </li>
      <li>
        <a class="nav-link" [href]="feedUrl" title="Assinar o feed RSS" aria-label="Feed RSS">
          <i class="bi bi-rss" aria-hidden="true"></i> <span class="nav-link__label">RSS</span>
        </a>
      </li>
    </ul>

    <button
      type="button"
      class="btn btn-ghost btn-sm btn-icon"
      (click)="theme.toggle()"
      [attr.aria-label]="theme.theme() === 'dark' ? 'Ativar tema claro' : 'Ativar tema escuro'"
      [title]="theme.theme() === 'dark' ? 'Ativar tema claro' : 'Ativar tema escuro'"
    >
      <i
        class="bi"
        [class.bi-sun]="theme.theme() === 'dark'"
        [class.bi-moon-stars]="theme.theme() === 'light'"
        aria-hidden="true"
      ></i>
    </button>
  </nav>
</header>

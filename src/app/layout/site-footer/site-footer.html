<footer class="footer">
  <div class="container footer__inner">
    <div class="footer__meta">
      <p>© {{ year }} {{ siteName }}</p>
      <p class="footer__versions">
        Front v{{ appVersion }} <span aria-hidden="true">·</span> API {{ apiVersion() }}
      </p>
    </div>
    <nav aria-label="Rodapé">
      <ul class="footer__links">
        <li>
          <a [href]="feedUrl"><i class="bi bi-rss" aria-hidden="true"></i> Assine o feed RSS</a>
        </li>
        <li>
          <a [href]="portfolioUrl" target="_blank" rel="noopener">
            <i class="bi bi-person" aria-hidden="true"></i> Portfólio
          </a>
        </li>
        <li>
          <a href="#conteudo">Voltar ao topo <i class="bi bi-arrow-up" aria-hidden="true"></i></a>
        </li>
      </ul>
    </nav>
  </div>
</footer>

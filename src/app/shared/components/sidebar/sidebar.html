<header class="sidebar sidebar--{{ state.name }}">
  <div class="sidebar__head">
    <ng-content select="[sidebarBrand]" />

    <button
      #menuToggle
      type="button"
      class="btn btn-ghost btn-sm btn-icon sidebar__toggle"
      aria-controls="menu-lateral"
      [attr.aria-expanded]="state.menuOpen()"
      [attr.aria-label]="state.menuOpen() ? 'Fechar menu' : 'Abrir menu'"
      [title]="state.menuOpen() ? 'Fechar menu' : 'Abrir menu'"
      (click)="state.toggleMenu()"
    >
      <i
        class="bi"
        [class.bi-list]="!state.menuOpen()"
        [class.bi-x-lg]="state.menuOpen()"
        aria-hidden="true"
      ></i>
    </button>
  </div>

  <div id="menu-lateral" class="sidebar__panel" [class.sidebar__panel--open]="state.menuOpen()">
    <div class="sidebar__nav">
      <ng-content />
    </div>

    <div class="sidebar__footer">
      <ng-content select="[sidebarFooter]" />

      <button
        type="button"
        class="sidebar-link sidebar__collapse"
        [attr.aria-expanded]="!state.collapsed()"
        [appTooltip]="state.collapsed() ? 'Expandir menu' : 'Recolher menu'"
        [appTooltipDisabled]="!state.showTooltips()"
        (click)="state.toggleCollapsed()"
      >
        <i class="bi bi-chevron-double-left" aria-hidden="true"></i>
        <span class="sidebar-link__label">{{
          state.collapsed() ? 'Expandir menu' : 'Recolher menu'
        }}</span>
      </button>
    </div>
  </div>

  @if (state.menuOpen()) {
    <div class="sidebar__backdrop" aria-hidden="true" (click)="closeMenu()"></div>
  }
</header>

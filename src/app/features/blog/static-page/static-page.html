@if (notFound()) {
  <app-not-found />
} @else {
  <div class="container">
    @if (page.error()) {
      <div class="state" role="alert">
        <i class="bi bi-exclamation-triangle" aria-hidden="true"></i>
        <p>Não foi possível carregar a página.</p>
        <button type="button" class="btn btn-outline" (click)="page.reload()">
          <i class="bi bi-arrow-clockwise" aria-hidden="true"></i> Tentar novamente
        </button>
      </div>
    } @else if (data(); as page) {
      <article class="static-page">
        <h1 class="section-title">{{ page.title }}</h1>
        <div #content class="prose" [innerHTML]="bodyHtml()"></div>
      </article>
    } @else {
      <p class="state">Carregando…</p>
    }
  </div>
}

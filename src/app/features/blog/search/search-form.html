<form class="search" role="search" novalidate (submit)="search($event)">
  <label for="busca-termo" class="visually-hidden">Buscar posts</label>
  <div class="search__box">
    <i class="bi bi-search" aria-hidden="true"></i>
    <input
      id="busca-termo"
      type="search"
      placeholder="Buscar posts por título ou resumo…"
      autocomplete="off"
      [formField]="searchForm.q"
      aria-describedby="busca-erro"
    />
    <button type="submit" class="btn btn-primary btn-sm">Buscar</button>
  </div>
  <div id="busca-erro" class="search__error">
    @if (searchForm.q().touched()) {
      @for (error of searchForm.q().errors(); track error.kind) {
        <p>{{ error.message }}</p>
      }
    }
  </div>
</form>

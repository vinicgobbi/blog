<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <!-- Aplica o tema antes da renderização para evitar "flash" (ver ThemeService) -->
    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <!-- Aplica o menu lateral recolhido antes da renderização (SIDEBAR_INIT_SCRIPT de @vinicgobbi/ui) -->
    <script>
      (function () {
        function mark(sidebar) {
          var state;
          try {
            state = localStorage.getItem('sidebar.' + sidebar.getAttribute('data-sidebar'));
          } catch (e) {}
          if (state === 'collapsed') {
            sidebar.setAttribute('data-collapsed', '');
          }
        }
        var observer = new MutationObserver(function (records) {
          records.forEach(function (record) {
            record.addedNodes.forEach(function (node) {
              if (node.nodeType !== 1) {
                return;
              }
              if (node.matches('.sidebar[data-sidebar]')) {
                mark(node);
              }
              node.querySelectorAll('.sidebar[data-sidebar]').forEach(mark);
            });
          });
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });
        document.addEventListener('DOMContentLoaded', function () {
          observer.disconnect();
        });
      })();
    </script>
    <meta charset="utf-8" />
    <title>Blog do Vinícius</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="Vinícius Cavati Gobbi" />
    <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta property="og:locale" content="pt_BR" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>

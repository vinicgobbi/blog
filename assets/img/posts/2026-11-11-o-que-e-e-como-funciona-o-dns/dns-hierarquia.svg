<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 600" width="860" height="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="860" height="600" rx="16" fill="#ffffff"/>

  <!-- Rótulos dos níveis -->
  <g font-size="14" fill="#64748b" font-weight="bold">
    <text x="24" y="55">Raiz</text>
    <text x="24" y="145">Domínios de topo (TLD)</text>
    <text x="24" y="235">2º nível</text>
    <text x="24" y="325">3º nível</text>
    <text x="24" y="415">4º nível (subdomínio)</text>
  </g>
  <g stroke="#e2e8f0" stroke-dasharray="4 4">
    <line x1="24" y1="95" x2="836" y2="95"/>
    <line x1="24" y1="185" x2="836" y2="185"/>
    <line x1="24" y1="275" x2="836" y2="275"/>
    <line x1="24" y1="365" x2="836" y2="365"/>
  </g>

  <!-- Ligações -->
  <g stroke="#cbd5e1" stroke-width="2" fill="none">
    <line x1="530" y1="70" x2="300" y2="120"/>
    <line x1="530" y1="70" x2="760" y2="120"/>
    <line x1="300" y1="160" x2="290" y2="210"/>
    <line x1="530" y1="160" x2="450" y2="210"/>
  </g>
  <g stroke="#2563eb" stroke-width="3" fill="none">
    <line x1="530" y1="70" x2="530" y2="120"/>
    <line x1="530" y1="160" x2="630" y2="210"/>
    <line x1="630" y1="250" x2="630" y2="300"/>
    <line x1="630" y1="340" x2="630" y2="390"/>
  </g>

  <!-- Nós -->
  <g font-size="16" text-anchor="middle" font-family="Consolas, Menlo, monospace">
    <rect x="490" y="30" width="80" height="40" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="530" y="56" font-weight="bold" fill="#1e3a8a">.</text>

    <rect x="250" y="120" width="100" height="40" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="300" y="146" fill="#334155">.com</text>
    <rect x="480" y="120" width="100" height="40" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="530" y="146" font-weight="bold" fill="#1e3a8a">.br</text>
    <rect x="710" y="120" width="100" height="40" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="760" y="146" fill="#334155">.org</text>

    <rect x="225" y="210" width="130" height="40" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="290" y="236" fill="#334155">google.com</text>
    <rect x="390" y="210" width="120" height="40" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="450" y="236" fill="#334155">com.br</text>
    <rect x="570" y="210" width="120" height="40" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="630" y="236" font-weight="bold" fill="#1e3a8a">dev.br</text>

    <rect x="520" y="300" width="220" height="40" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="630" y="326" font-weight="bold" fill="#1e3a8a">vinicgobbi.dev.br</text>

    <rect x="500" y="390" width="260" height="40" rx="10" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
    <text x="630" y="416" font-weight="bold" fill="#ffffff">blog.vinicgobbi.dev.br</text>
  </g>

  <!-- Leitura do nome -->
  <rect x="24" y="455" width="812" height="125" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="430" y="483" text-anchor="middle" font-size="14" fill="#64748b">O nome é lido da direita para a esquerda, do mais geral para o mais específico ←</text>
  <g font-size="28" font-weight="bold" text-anchor="middle" font-family="Consolas, Menlo, monospace">
    <text x="250" y="530" fill="#ea580c">blog</text>
    <text x="305" y="530" fill="#94a3b8">.</text>
    <text x="410" y="530" fill="#16a34a">vinicgobbi</text>
    <text x="515" y="530" fill="#94a3b8">.</text>
    <text x="565" y="530" fill="#7c3aed">dev</text>
    <text x="615" y="530" fill="#94a3b8">.</text>
    <text x="660" y="530" fill="#2563eb">br</text>
    <text x="710" y="530" fill="#0f172a">.</text>
  </g>
  <g font-size="13" text-anchor="middle" fill="#475569">
    <text x="250" y="562">subdomínio</text>
    <text x="410" y="562">domínio</text>
    <text x="565" y="562">2º nível</text>
    <text x="660" y="562">TLD</text>
    <text x="715" y="562">raiz</text>
  </g>
</svg>

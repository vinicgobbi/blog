<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" width="920" height="640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="seta-azul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="seta-verde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="920" height="640" rx="16" fill="#ffffff"/>

  <!-- Caixas -->
  <rect x="40" y="200" width="160" height="100" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="120" y="243" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Seu computador</text>
  <text x="120" y="266" text-anchor="middle" font-size="13" fill="#475569">(navegador / SO)</text>

  <rect x="340" y="170" width="200" height="160" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="440" y="222" text-anchor="middle" font-size="16" font-weight="bold" fill="#9a3412">Resolvedor</text>
  <text x="440" y="243" text-anchor="middle" font-size="16" font-weight="bold" fill="#9a3412">recursivo</text>
  <text x="440" y="270" text-anchor="middle" font-size="12" fill="#9a3412">provedor de internet,</text>
  <text x="440" y="286" text-anchor="middle" font-size="12" fill="#9a3412">1.1.1.1, 8.8.8.8...</text>
  <text x="440" y="312" text-anchor="middle" font-size="11" font-style="italic" fill="#c2410c">guarda as respostas em cache</text>

  <rect x="680" y="35" width="200" height="80" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="780" y="70" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">Servidor raiz</text>
  <text x="780" y="93" text-anchor="middle" font-size="14" fill="#1e40af" font-family="Consolas, Menlo, monospace">.</text>

  <rect x="680" y="210" width="200" height="80" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="780" y="245" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">Servidor do TLD</text>
  <text x="780" y="268" text-anchor="middle" font-size="14" fill="#1e40af" font-family="Consolas, Menlo, monospace">.br</text>

  <rect x="680" y="385" width="200" height="80" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="780" y="420" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">Servidor autoritativo</text>
  <text x="780" y="443" text-anchor="middle" font-size="13" fill="#1e40af" font-family="Consolas, Menlo, monospace">vinicgobbi.dev.br</text>

  <!-- Perguntas (azul) -->
  <g stroke="#2563eb" stroke-width="2.5" fill="none">
    <line x1="200" y1="238" x2="336" y2="238" marker-end="url(#seta-azul)"/>
    <line x1="540" y1="180" x2="677" y2="64" marker-end="url(#seta-azul)"/>
    <line x1="540" y1="240" x2="676" y2="240" marker-end="url(#seta-azul)"/>
    <line x1="540" y1="294" x2="677" y2="410" marker-end="url(#seta-azul)"/>
  </g>
  <!-- Respostas (verde) -->
  <g stroke="#16a34a" stroke-width="2.5" fill="none" stroke-dasharray="7 4">
    <line x1="680" y1="88" x2="543" y2="204" marker-end="url(#seta-verde)"/>
    <line x1="680" y1="262" x2="544" y2="262" marker-end="url(#seta-verde)"/>
    <line x1="680" y1="438" x2="543" y2="322" marker-end="url(#seta-verde)"/>
    <line x1="340" y1="265" x2="204" y2="265" marker-end="url(#seta-verde)"/>
  </g>

  <!-- Números -->
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">
    <circle cx="255" cy="238" r="12" fill="#2563eb"/><text x="255" y="243">1</text>
    <circle cx="582" cy="144" r="12" fill="#2563eb"/><text x="582" y="149">2</text>
    <circle cx="638" cy="124" r="12" fill="#16a34a"/><text x="638" y="129">3</text>
    <circle cx="582" cy="240" r="12" fill="#2563eb"/><text x="582" y="245">4</text>
    <circle cx="638" cy="262" r="12" fill="#16a34a"/><text x="638" y="267">5</text>
    <circle cx="582" cy="330" r="12" fill="#2563eb"/><text x="582" y="335">6</text>
    <circle cx="638" cy="403" r="12" fill="#16a34a"/><text x="638" y="408">7</text>
    <circle cx="285" cy="265" r="12" fill="#16a34a"/><text x="285" y="270">8</text>
  </g>

  <!-- Legenda -->
  <rect x="24" y="490" width="872" height="130" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <g font-size="13" fill="#334155">
    <text x="44" y="520"><tspan font-weight="bold" fill="#2563eb">1.</tspan> "Qual o IP de blog.vinicgobbi.dev.br?"</text>
    <text x="44" y="545"><tspan font-weight="bold" fill="#2563eb">2.</tspan> O resolvedor pergunta ao servidor raiz</text>
    <text x="44" y="570"><tspan font-weight="bold" fill="#16a34a">3.</tspan> A raiz responde: "pergunte aos servidores do .br"</text>
    <text x="44" y="595"><tspan font-weight="bold" fill="#2563eb">4.</tspan> O resolvedor pergunta ao servidor do .br</text>
    <text x="470" y="520"><tspan font-weight="bold" fill="#16a34a">5.</tspan> O .br responde: "quem sabe é o autoritativo do domínio"</text>
    <text x="470" y="545"><tspan font-weight="bold" fill="#2563eb">6.</tspan> O resolvedor pergunta ao servidor autoritativo</text>
    <text x="470" y="570"><tspan font-weight="bold" fill="#16a34a">7.</tspan> O autoritativo responde: "é o 203.0.113.10"</text>
    <text x="470" y="595"><tspan font-weight="bold" fill="#16a34a">8.</tspan> O resolvedor entrega o IP (e guarda em cache)</text>
  </g>
</svg>
